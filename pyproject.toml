[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropixel_data_exporter"
version = "2.0.4"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "plotly>=5.20",
    "openpyxl>=3.1",
    "XlsxWriter>=3.1",
    "scipy>=1.10",
    "PySide6>=6.6",
    "QDarkStyle>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff.lint]
# Preserve the existing checks across changes to Ruff's default rule selection.
select = ["E4", "E7", "E9", "F"]
